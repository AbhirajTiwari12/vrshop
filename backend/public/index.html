<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VRShop">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Photograph your room, get real furniture picks with true-scale 3D models, and place them in your room on Meta Quest.">
  <title>VRShop · Design your room in VR</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="VRShop home">
        <img class="brand-logo" src="/icon.svg" alt="" width="30" height="30">
        <span class="brand-name">VRShop</span>
      </a>
      <div class="topbar-right" id="topbar-right"></div>
    </div>
  </header>

  <div id="offline" class="offline" role="status" hidden>
    <span class="mini-spin"></span> Reconnecting to the VRShop server…
  </div>

  <main id="app" class="page" tabindex="-1">
    <noscript><p class="card">VRShop needs JavaScript to run.</p></noscript>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="Session" hidden>
    <a class="tab" data-tab="room" href="#/">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3"/><path d="M2 16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z"/><path d="M4 18v2M20 18v2"/></svg>
      <span>Room</span>
    </a>
    <a class="tab" data-tab="cart" href="#/">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Cart</span>
      <span class="tab-badge" id="cart-count">0</span>
    </a>
  </nav>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>
</body>
</html>
